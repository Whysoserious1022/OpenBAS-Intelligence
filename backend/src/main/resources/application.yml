spring:
  application:
    name: openbas-intelligence

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openbas}
    username: ${DB_USERNAME:openbas}
    password: ${DB_PASSWORD:openbas_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OpenBAS-HikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
  show-actuator: false

# =========================================
# OpenBAS Configuration
# =========================================
openbas:
  gateway:
    mqtt:
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      client-id: openbas-gateway-${random.uuid}
      username: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}
      connection-timeout: 30
      keep-alive-interval: 60
      auto-reconnect: true
      topics:
        telemetry: openbas/telemetry/#
        commands: openbas/commands/#
        status: openbas/status/#
    bacnet:
      enabled: ${BACNET_ENABLED:false}
      local-network-number: 0
      local-ip: ${BACNET_LOCAL_IP:0.0.0.0}
      port: ${BACNET_PORT:47808}
      timeout-ms: 5000
    simulator:
      enabled: true
      buildings:
        - id: BUILDING-01
          name: "Nexus Tower"
          floors: 5
          zones-per-floor: 4
      telemetry-interval-ms: 5000
      fault-scenario: none

  telemetry:
    ingestion:
      thread-pool-size: 10
      queue-capacity: 10000
      batch-size: 100
      flush-interval-ms: 1000
    retention:
      raw-days: 90
      aggregated-days: 730
    anomaly:
      evaluation-enabled: true
      evaluation-interval-ms: 30000

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout-seconds: 30
    enabled: ${AI_SERVICE_ENABLED:true}

  security:
    jwt:
      secret: ${JWT_SECRET:openbas-dev-secret-change-in-production-must-be-32chars}
      expiration-hours: 8
      refresh-expiration-hours: 168
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  commands:
    live-execution-enabled: ${LIVE_EXECUTION_ENABLED:false}
    approval-required-by-default: true
    expiry-minutes: 60
    max-setpoint-change-celsius: 5.0
    min-temperature-celsius: 10.0
    max-temperature-celsius: 35.0

logging:
  level:
    root: INFO
    com.openbas: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:openbas_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
openbas:
  ai-service:
    enabled: false
  gateway:
    mqtt:
      auto-reconnect: false
    simulator:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:openbas_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
openbas:
  ai-service:
    enabled: true
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
  gateway:
    mqtt:
      auto-reconnect: false
    simulator:
      enabled: true
      telemetry-interval-ms: 3000
  commands:
    live-execution-enabled: false
    approval-required-by-default: true

