# Eclipse Mosquitto MQTT Broker Configuration
# OpenBAS Intelligence Platform

# Allow anonymous connections for local development
# In production: set allow_anonymous false and configure passwords
allow_anonymous true

# Standard MQTT port
listener 1883

# WebSocket support (for browser-based debugging)
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Message size limit (1MB)
message_size_limit 1048576

# Maximum QoS 1 inflight messages per client
max_inflight_messages 100

# Queue size for offline clients
max_queued_messages 1000
