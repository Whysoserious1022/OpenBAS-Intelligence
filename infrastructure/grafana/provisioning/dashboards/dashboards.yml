# ============================================================
# Grafana Dashboard Provisioning — OpenBAS Intelligence
# Points Grafana at the dashboards directory at startup
# ============================================================
apiVersion: 1

providers:
  - name: OpenBAS Intelligence Dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

